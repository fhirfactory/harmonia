---
- name: Query current MicroK8s enabled add-on status
  ansible.builtin.command: microk8s status --format yaml
  register: microk8s_status_yaml
  changed_when: false
  become: true

- name: Parse enabled add-ons list
  ansible.builtin.set_fact:
    microk8s_status_data: "{{ microk8s_status_yaml.stdout | from_yaml }}"

- name: Enable required MicroK8s add-on idempotently
  ansible.builtin.command: "microk8s enable {{ item.name }}"
  loop: "{{ microk8s_addons }}"
  register: addon_enable_result
  changed_when: "'already enabled' not in addon_enable_result.stdout and 'is already enabled' not in addon_enable_result.stderr"
  failed_when: "addon_enable_result.rc != 0 and 'already enabled' not in addon_enable_result.stdout"
  become: true

- name: Wait for MicroK8s cluster to stabilize after add-on activation
  ansible.builtin.command: microk8s status --wait-ready --timeout 120
  changed_when: false
  become: true
