---
- name: Create or update database credentials secret
  ansible.builtin.shell: |
    microk8s kubectl create secret generic harmonia-db-secrets \
      --namespace {{ harmonia_namespace }} \
      --from-literal=fhir-password='{{ vault_postgres_fhir_password | default("fhir_password") }}' \
      --from-literal=ops-password='{{ vault_postgres_ops_password | default("ops_password") }}' \
      --dry-run=client -o yaml | microk8s kubectl apply -f -
  no_log: true
  become: true
  changed_when: false

- name: Create or update Artemis messaging credentials secret
  ansible.builtin.shell: |
    microk8s kubectl create secret generic harmonia-artemis-secrets \
      --namespace {{ harmonia_namespace }} \
      --from-literal=admin-password='{{ vault_artemis_admin_password | default("admin") }}' \
      --from-literal=cluster-password='{{ vault_artemis_cluster_password | default("artemisClusterPassword") }}' \
      --dry-run=client -o yaml | microk8s kubectl apply -f -
  no_log: true
  become: true
  changed_when: false

- name: Create or update Infinispan credentials secret
  ansible.builtin.shell: |
    microk8s kubectl create secret generic harmonia-infinispan-secrets \
      --namespace {{ harmonia_namespace }} \
      --from-literal=admin-password='{{ vault_infinispan_admin_password | default("admin") }}' \
      --dry-run=client -o yaml | microk8s kubectl apply -f -
  no_log: true
  become: true
  changed_when: false
