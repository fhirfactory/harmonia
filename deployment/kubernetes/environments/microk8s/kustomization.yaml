  - name: localhost:32000/harmonia/ponos-task-processor
    newName: localhost:32000/harmonia/ponos-task-processor
    newTag: 1.0.0-SNAPSHOT
  - name: localhost:32000/harmonia/pylai-mllp-in
    newName: localhost:32000/harmonia/pylai-mllp-in
    newTag: 1.0.0-SNAPSHOT
  - name: localhost:32000/harmonia/pylai-mllp-out
    newName: localhost:32000/harmonia/pylai-mllp-out
    newTag: 1.0.0-SNAPSHOT
  - name: localhost:32000/harmonia/iris-befe
