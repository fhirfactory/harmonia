apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harmonia

resources:
  - ../../base

patches:
  - target:
      kind: StatefulSet
      name: postgres-1
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: postgres-2
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: postgres-ops-1
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: postgres-ops-2
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: infinispan-1
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: infinispan-2
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: artemis-primary-a
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: artemis-backup-a
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: artemis-primary-b
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath
  - target:
      kind: StatefulSet
      name: artemis-backup-b
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: microk8s-hostpath

images:
  - name: localhost:32000/harmonia/mnemosyne-clinical
    newName: localhost:32000/harmonia/mnemosyne-clinical
    newTag: 1.0.0-SNAPSHOT
