---
apiVersion: v1
kind: Service
metadata:
  name: befe
  namespace: harmonia
  labels:
    app.kubernetes.io/name: iris-befe
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: harmonia-platform
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: clinical
    - port: 8090
      targetPort: 8090
      name: operations
    - port: 9990
      targetPort: 9990
      name: management
  selector:
    app.kubernetes.io/name: iris-befe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: befe
  namespace: harmonia
  labels:
    app.kubernetes.io/name: iris-befe
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: harmonia-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iris-befe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iris-befe
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: harmonia-platform
    spec:
      containers:
        - name: befe
          image: localhost:32000/harmonia/iris-befe:1.0.0-SNAPSHOT
          env:
            - name: INFINISPAN_HOST
              value: "infinispan-1"
            - name: INFINISPAN_PORT
              value: "11222"
            - name: INFINISPAN_USER
              value: "admin"
            - name: INFINISPAN_PASSWORD
              value: "admin"
            - name: OPERATIONS_PORT
              value: "8090"
            - name: OIDC_ISSUER_URL
              value: "http://keycloak.harmonia.svc.cluster.local:8080/realms/harmonia"
            - name: OIDC_CLIENT_ID
              value: "iris-befe"
          ports:
            - containerPort: 8080
              name: clinical
            - containerPort: 8090
              name: operations
            - containerPort: 9990
              name: management
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
