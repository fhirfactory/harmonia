---
apiVersion: v1
kind: Service
metadata:
  name: iris-administration
  namespace: harmonia
  labels:
    app.kubernetes.io/name: iris-administration
    app.kubernetes.io/component: presentation
    app.kubernetes.io/part-of: harmonia-platform
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: iris-administration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-administration
  namespace: harmonia
  labels:
    app.kubernetes.io/name: iris-administration
    app.kubernetes.io/component: presentation
    app.kubernetes.io/part-of: harmonia-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iris-administration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iris-administration
        app.kubernetes.io/component: presentation
        app.kubernetes.io/part-of: harmonia-platform
    spec:
      containers:
        - name: iris-administration
          image: localhost:32000/harmonia/iris-administration:1.0.0-SNAPSHOT
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
