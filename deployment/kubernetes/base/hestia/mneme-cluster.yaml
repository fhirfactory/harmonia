---
# Mneme Infinispan Discovery & Cluster Services
apiVersion: v1
kind: Service
metadata:
  name: infinispan-service
  namespace: harmonia
  labels:
    app.kubernetes.io/name: mneme-cluster
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: harmonia-platform
spec:
  ports:
    - port: 11222
      targetPort: 11222
      name: hotrod
    - port: 7800
      targetPort: 7800
      name: jgroups
  selector:
    app.kubernetes.io/name: mneme-cluster
---
apiVersion: v1
kind: Service
metadata:
  name: infinispan-1
  namespace: harmonia
  labels:
    app.kubernetes.io/name: infinispan-1
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: harmonia-platform
spec:
  ports:
    - port: 11222
      targetPort: 11222
      name: hotrod
    - port: 7800
      targetPort: 7800
      name: jgroups
  selector:
    app.kubernetes.io/name: infinispan-1
---
apiVersion: v1
kind: Service
metadata:
  name: infinispan-2
  namespace: harmonia
  labels:
    app.kubernetes.io/name: infinispan-2
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: harmonia-platform
spec:
  ports:
    - port: 11222
      targetPort: 11222
      name: hotrod
    - port: 7800
      targetPort: 7800
      name: jgroups
  selector:
    app.kubernetes.io/name: infinispan-2
---
# Infinispan Node 1 StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: infinispan-1
  namespace: harmonia
  labels:
    app.kubernetes.io/name: infinispan-1
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: harmonia-platform
spec:
  serviceName: infinispan-1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infinispan-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infinispan-1
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: harmonia-platform
    spec:
      containers:
        - name: mneme-cluster
          image: localhost:32000/harmonia/mneme-cluster:1.0.0-SNAPSHOT
          env:
            - name: JAVA_OPTIONS
              value: "-Dinfinispan.node.name=node1 -Dfhir.server.url=http://hapi-fhir-jpa-server-1:8080/fhir -Dops.server.url=http://operations-1:8080/api/operations"
          ports:
            - containerPort: 11222
              name: hotrod
            - containerPort: 7800
              name: jgroups
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          livenessProbe:
            tcpSocket:
              port: 11222
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 11222
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mneme-data-1
              mountPath: /opt/infinispan/server/data
  volumeClaimTemplates:
    - metadata:
        name: mneme-data-1
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

