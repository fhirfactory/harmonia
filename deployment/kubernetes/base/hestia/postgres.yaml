---
# PostgreSQL Node 1 (Clinical FHIR DB Node 1)
apiVersion: v1
kind: Service
metadata:
  name: postgres-1
  namespace: harmonia
  labels:
    app.kubernetes.io/name: postgres-1
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: harmonia-platform
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: postgres-1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-1
  namespace: harmonia
  labels:
    app.kubernetes.io/name: postgres-1
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: harmonia-platform
spec:
  serviceName: postgres-1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-1
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: harmonia-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "postgres"
            - "-c"
            - "log_statement=all"
            - "-c"
            - "log_min_duration_statement=0"
          env:
            - name: POSTGRES_DB
              value: "fhir_node_1"
            - name: POSTGRES_USER
              value: "fhir_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harmonia-db-secrets
                  key: fhir-password
                  optional: true
            - name: POSTGRES_PASSWORD_DEFAULT
              value: "fhir_password"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fhir_user", "-d", "fhir_node_1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fhir_user", "-d", "fhir_node_1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data-1
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data-1
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

