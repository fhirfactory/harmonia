---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-synapse
  namespace: harmonia
  labels:
    app.kubernetes.io/name: postgres-synapse
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: harmonia-platform
spec:
  serviceName: postgres-synapse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-synapse
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: harmonia-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "postgres"
            - "-c"
            - "log_statement=all"
            - "-c"
            - "log_min_duration_statement=0"
          env:
            - name: POSTGRES_DB
              value: "synapse_db"
            - name: POSTGRES_USER
              value: "synapse_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harmonia-synapse-secrets
                  key: db-password
                  optional: true
            - name: POSTGRES_PASSWORD_DEFAULT
              value: "synapse_db_password"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "synapse_user", "-d", "synapse_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "synapse_user", "-d", "synapse_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-synapse-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-synapse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapse
  namespace: harmonia
  labels:
    app.kubernetes.io/name: synapse
    app.kubernetes.io/component: collaboration
    app.kubernetes.io/part-of: harmonia-platform
spec:
  serviceName: synapse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
        app.kubernetes.io/component: collaboration
        app.kubernetes.io/part-of: harmonia-platform
    spec:
      containers:
        - name: synapse
          image: matrixdotorg/synapse:v1.120.0
          env:
            - name: SYNAPSE_SERVER_NAME
              value: "harmonia.local"
            - name: SYNAPSE_REPORT_STATS
              value: "no"
            - name: SYNAPSE_CONFIG_PATH
              value: "/data/homeserver.yaml"
            - name: SYNAPSE_REGISTRATION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: harmonia-synapse-secrets
                  key: registration-shared-secret
                  optional: true
            - name: SYNAPSE_MACAROON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: harmonia-synapse-secrets
                  key: macaroon-secret-key
                  optional: true
          ports:
            - containerPort: 8008
              name: http-matrix
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: synapse-data
              mountPath: /data
            - name: synapse-config-volume
              mountPath: /data/homeserver.yaml
              subPath: homeserver.yaml
            - name: synapse-appservice-volume
              mountPath: /data/appservices/appservice-agora.yaml
              subPath: appservice-agora.yaml
      volumes:
        - name: synapse-config-volume
          configMap:
            name: synapse-config
        - name: synapse-appservice-volume
          configMap:
            name: synapse-appservice-registration
  volumeClaimTemplates:
    - metadata:
        name: synapse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
