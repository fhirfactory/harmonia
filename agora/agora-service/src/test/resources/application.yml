server:
  port: 0

agora:
  synapse:
    base-url: "http://synapse:8008"
  security:
    hs-token: "test-hs-token"
    as-token: "test-as-token"
    admin-token: "test-admin-token"
  appservice:
    id: "harmonia-agora"
    url: "http://agora:8092"
  matrix:
    server-name: "harmonia.local"
  reconciliation:
    cron: "0 */15 * * * *"

spring:
  application:
    name: agora-service-test
  datasource:
    url: jdbc:h2:mem:agora_service_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
