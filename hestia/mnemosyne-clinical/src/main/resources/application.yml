server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    client-auth: ${SERVER_SSL_CLIENT_AUTH:need}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:mnemosyne}
    trust-store: ${SERVER_SSL_TRUST_STORE:}
    trust-store-password: ${SERVER_SSL_TRUST_STORE_PASSWORD:}
    trust-store-type: ${SERVER_SSL_TRUST_STORE_TYPE:PKCS12}

spring:
  application:
    name: mnemosyne-clinical
  main:
    allow-circular-references: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
  elasticsearch:
    rest:
      sniffer:
        interval: -1ms
  datasource:
    url: jdbc:h2:mem:fhir_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        search:
          backend:
            type: lucene
            analysis:
              configurer: ca.uhn.fhir.jpa.search.HapiHSearchAnalysisConfigurers$HapiLuceneAnalysisConfigurer
            directory:
              type: local-heap

hapi:
  fhir:
    version: R5
    server-address: "http://localhost:8080/fhir"

management:
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always
