services:
  # -------------------------------------------------------------
  # Tier 5. Relational Database for HAPI FHIR Node 1
  # -------------------------------------------------------------
  postgres-1:
    image: postgres:16-alpine
    container_name: harmonia-postgres-1
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_min_duration_statement=0"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    environment:
      POSTGRES_DB: fhir_node_1
      POSTGRES_USER: fhir_user
      POSTGRES_PASSWORD: fhir_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir_user -d fhir_node_1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 5. Relational Database for HAPI FHIR Node 2
  # -------------------------------------------------------------
  postgres-2:
    image: postgres:16-alpine
    container_name: harmonia-postgres-2
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_min_duration_statement=0"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    environment:
      POSTGRES_DB: fhir_node_2
      POSTGRES_USER: fhir_user
      POSTGRES_PASSWORD: fhir_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir_user -d fhir_node_2"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 5. Relational Database for Operations Node 1
  # -------------------------------------------------------------
  postgres-ops-1:
    image: postgres:16-alpine
    container_name: harmonia-postgres-ops-1
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_min_duration_statement=0"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    environment:
      POSTGRES_DB: ops_node_1
      POSTGRES_USER: ops_user
      POSTGRES_PASSWORD: ops_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_ops_data_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_user -d ops_node_1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 5. Relational Database for Operations Node 2
  # -------------------------------------------------------------
  postgres-ops-2:
    image: postgres:16-alpine
    container_name: harmonia-postgres-ops-2
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_min_duration_statement=0"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    environment:
      POSTGRES_DB: ops_node_2
      POSTGRES_USER: ops_user
      POSTGRES_PASSWORD: ops_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_ops_data_2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_user -d ops_node_2"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 5. Replicated Mnemosyne Clinical JPA Server Nodes (FHIR R5)
  # -------------------------------------------------------------
  hapi-fhir-jpa-server-1:
    build:
      context: ./hestia/mnemosyne-clinical
      dockerfile: Dockerfile
    container_name: harmonia-hapi-fhir-1
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-1:5432/fhir_node_1
      SPRING_DATASOURCE_USERNAME: fhir_user
      SPRING_DATASOURCE_PASSWORD: fhir_password
    ports:
      - "8081:8080"
    depends_on:
      postgres-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - harmonia-network

  hapi-fhir-jpa-server-2:
    build:
      context: ./hestia/mnemosyne-clinical
      dockerfile: Dockerfile
    container_name: harmonia-hapi-fhir-2
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-2:5432/fhir_node_2
      SPRING_DATASOURCE_USERNAME: fhir_user
      SPRING_DATASOURCE_PASSWORD: fhir_password
    ports:
      - "8082:8080"
    depends_on:
      postgres-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 5. Replicated Mnemosyne Operations JPA Server Nodes (Non-FHIR & TaskSequences)
  # -------------------------------------------------------------
  operations-1:
    build:
      context: ./hestia/mnemosyne-operations
      dockerfile: Dockerfile
    container_name: harmonia-operations-1
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ops-1:5432/ops_node_1
      SPRING_DATASOURCE_USERNAME: ops_user
      SPRING_DATASOURCE_PASSWORD: ops_password
    ports:
      - "8085:8080"
    depends_on:
      postgres-ops-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - harmonia-network

  operations-2:
    build:
      context: ./hestia/mnemosyne-operations
      dockerfile: Dockerfile
    container_name: harmonia-operations-2
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ops-2:5432/ops_node_2
      SPRING_DATASOURCE_USERNAME: ops_user
      SPRING_DATASOURCE_PASSWORD: ops_password
    ports:
      - "8086:8080"
    depends_on:
      postgres-ops-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 3 & 4. Mneme (Infinispan) Cluster with Custom Persistence Store SPI
  # -------------------------------------------------------------
  infinispan-1:
    build:
      context: ./hestia/mneme-cluster
      dockerfile: Dockerfile
    container_name: harmonia-infinispan-node1
    environment:
      JAVA_OPTIONS: "-Dinfinispan.node.name=node1 -Dfhir.server.url=http://hapi-fhir-jpa-server-1:8080/fhir -Dops.server.url=http://operations-1:8080/api/operations"
    ports:
      - "11222:11222"
      - "7800:7800"
    depends_on:
      hapi-fhir-jpa-server-1:
        condition: service_healthy
      operations-1:
        condition: service_healthy
    networks:
      - harmonia-network

  infinispan-2:
    build:
      context: ./hestia/mneme-cluster
      dockerfile: Dockerfile
    container_name: harmonia-infinispan-node2
    environment:
      JAVA_OPTIONS: "-Dinfinispan.node.name=node2 -Dfhir.server.url=http://hapi-fhir-jpa-server-2:8080/fhir -Dops.server.url=http://operations-2:8080/api/operations"
    ports:
      - "11223:11222"
      - "7801:7800"
    depends_on:
      hapi-fhir-jpa-server-2:
        condition: service_healthy
      operations-2:
        condition: service_healthy
      infinispan-1:
        condition: service_started
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 2. WildFly Jakarta EE Backend-For-Frontend (BEFE)
  # -------------------------------------------------------------
  befe:
    build:
      context: ./iris/iris-befe
      dockerfile: Dockerfile
    container_name: harmonia-befe
    environment:
      INFINISPAN_HOST: infinispan-1
      INFINISPAN_PORT: 11222
      INFINISPAN_USER: admin
      INFINISPAN_PASSWORD: admin
      OPERATIONS_PORT: 8090
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8081/realms/harmonia}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-iris-befe}
      FHIR_DB_URL: ${FHIR_DB_URL:-jdbc:postgresql://postgres-1:5432/fhir_node_1}
      FHIR_DB_USER: ${FHIR_DB_USER:-fhir_user}
      FHIR_DB_PASSWORD: ${FHIR_DB_PASSWORD:-fhir_password}
    ports:
      - "8080:8080"
      - "8090:8090"
      - "9990:9990"
    depends_on:
      - infinispan-1
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Tier 1. TypeScript / Vue 3 SPAs with Nginx Gateway
  # -------------------------------------------------------------
  iris-clinical:
    build:
      context: ./iris/iris-clinical
      dockerfile: Dockerfile
    container_name: harmonia-iris-clinical
    ports:
      - "3000:80"
    depends_on:
      - befe
    networks:
      - harmonia-network

  iris-console:
    build:
      context: ./iris
      dockerfile: iris-console/Dockerfile
    container_name: harmonia-iris-console
    ports:
      - "3001:80"
    depends_on:
      - befe
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Petasos Messaging Services: Standalone ActiveMQ Artemis Broker Runtime
  # -------------------------------------------------------------
  petasos:
    image: apache/activemq-artemis:2.33.0
    container_name: harmonia-petasos
    # Start as root so entrypoint can chown the named petasos_data volume, then drop to artemis.
    user: "0"
    entrypoint: ["/bin/bash", "/docker-entrypoint.sh"]
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-admin}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-adminPassword}
      PETASOS_BROKER_USER: ${PETASOS_BROKER_USER:-harmonia}
      PETASOS_BROKER_PASSWORD: ${PETASOS_BROKER_PASSWORD:-harmoniaPassword}
      # Valid artemis create flags only. etc-override/broker.xml is applied by docker-entrypoint.sh.
      # Do not use --override-config (unsupported by artemis create).
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia --nio"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - ./petasos/deployment/artemis/standalone/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./petasos/deployment/artemis/standalone/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
      - petasos_data:/var/lib/artemis-instance/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8161/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Pylai (Interface / Gateway Services): MLLP Inbound Gateway (HL7 v2.4 Ingestion & Transformation)
  # -------------------------------------------------------------
  mllp-gateway:
    build:
      context: ./pylai/pylai-mllp-in
      dockerfile: Dockerfile
    container_name: harmonia-mllp-gateway
    environment:
      MLLP_HOST: "0.0.0.0"
      MLLP_PORT: "2575"
      INFINISPAN_HOST: infinispan-1
      INFINISPAN_PORT: 11222
      INFINISPAN_USER: admin
      INFINISPAN_PASSWORD: admin
      PETASOS_HA_ENABLED: "false"
      PETASOS_BROKER_URL: "tcp://petasos:61616"
      PETASOS_BROKER_USER: ${PETASOS_BROKER_USER:-harmonia}
      PETASOS_BROKER_PASSWORD: ${PETASOS_BROKER_PASSWORD:-harmoniaPassword}
      TASK_PROCESSOR_URL: http://task-processor:8080/api/queue/event
    ports:
      - "2575:2575"
      - "8084:8080"
    depends_on:
      infinispan-1:
        condition: service_started
      petasos:
        condition: service_healthy
      task-processor:
        condition: service_started
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Pylai (Interface / Gateway Services): MLLP Outbound Gateway Instances (Egress)
  # Demonstrating multi-instance egress with independent dedicated Petasos queues per endpoint
  # -------------------------------------------------------------
  mllp-outbound-his:
    build:
      context: ./pylai/pylai-mllp-out
      dockerfile: Dockerfile
    container_name: harmonia-mllp-outbound-his
    environment:
      MLLP_OUTBOUND_INSTANCE_ID: "mllp-sender-his"
      MLLP_OUTBOUND_TARGET_ENDPOINT_ID: "HIS_NORTH"
      MLLP_OUTBOUND_QUEUE_PREFIX: "petasos.queue.mllp.outbound"
      MLLP_OUTBOUND_PORT: "8087"
      PETASOS_HA_ENABLED: "false"
      PETASOS_BROKER_URL: "tcp://petasos:61616"
      PETASOS_BROKER_USER: ${PETASOS_BROKER_USER:-harmonia}
      PETASOS_BROKER_PASSWORD: ${PETASOS_BROKER_PASSWORD:-harmoniaPassword}
      TASK_PROCESSOR_BROKER_URL: "tcp://petasos:61616"
      TASK_PROCESSOR_BROKER_USERNAME: ${PETASOS_BROKER_USER:-harmonia}
      TASK_PROCESSOR_BROKER_PASSWORD: ${PETASOS_BROKER_PASSWORD:-harmoniaPassword}
      INFINISPAN_HOST: infinispan-1
      INFINISPAN_PORT: 11222
      INFINISPAN_USER: admin
      INFINISPAN_PASSWORD: admin
    ports:
      - "8087:8080"
    depends_on:
      infinispan-1:
        condition: service_started
      petasos:
        condition: service_healthy
      task-processor:
        condition: service_started
    networks:
      - harmonia-network

  mllp-outbound-lis:
    build:
      context: ./pylai/pylai-mllp-out
      dockerfile: Dockerfile
    container_name: harmonia-mllp-outbound-lis
    environment:
      MLLP_OUTBOUND_INSTANCE_ID: "mllp-sender-lis"
      MLLP_OUTBOUND_TARGET_ENDPOINT_ID: "LIS_MAIN"
      MLLP_OUTBOUND_QUEUE_PREFIX: "petasos.queue.mllp.outbound"
      MLLP_OUTBOUND_PORT: "8088"
      PETASOS_HA_ENABLED: "false"
      PETASOS_BROKER_URL: "tcp://petasos:61616"
      PETASOS_BROKER_USER: ${PETASOS_BROKER_USER:-harmonia}
      PETASOS_BROKER_PASSWORD: ${PETASOS_BROKER_PASSWORD:-harmoniaPassword}
      TASK_PROCESSOR_BROKER_URL: "tcp://petasos:61616"
      TASK_PROCESSOR_BROKER_USERNAME: ${PETASOS_BROKER_USER:-harmonia}
      TASK_PROCESSOR_BROKER_PASSWORD: ${PETASOS_BROKER_PASSWORD:-harmoniaPassword}
      INFINISPAN_HOST: infinispan-1
      INFINISPAN_PORT: 11222
      INFINISPAN_USER: admin
      INFINISPAN_PASSWORD: admin
    ports:
      - "8088:8080"
    depends_on:
      infinispan-1:
        condition: service_started
      petasos:
        condition: service_healthy
      task-processor:
        condition: service_started
    networks:
      - harmonia-network

  # -------------------------------------------------------------
  # Energeia Workflow Services. Asynchronous Task Sequence Processor (WildFly + Artemis)
  # -------------------------------------------------------------
  task-processor:
    build:
      context: ./energeia/ponos
      dockerfile: Dockerfile
    container_name: harmonia-task-processor
    environment:
      INFINISPAN_HOST: infinispan-1
      INFINISPAN_PORT: 11222
      INFINISPAN_USER: admin
      INFINISPAN_PASSWORD: admin
      PETASOS_HA_ENABLED: "false"
      PETASOS_BROKER_URL: "tcp://petasos:61616"
      PETASOS_BROKER_USER: ${PETASOS_BROKER_USER:-harmonia}
      PETASOS_BROKER_PASSWORD: ${PETASOS_BROKER_PASSWORD:-harmoniaPassword}
    ports:
      - "8083:8080"
    depends_on:
      infinispan-1:
        condition: service_started
      petasos:
        condition: service_healthy
    networks:
      - harmonia-network

networks:
  harmonia-network:
    driver: bridge

volumes:
  postgres_data_1:
  postgres_data_2:
  postgres_ops_data_1:
  postgres_ops_data_2:
  petasos_data:
